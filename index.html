<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sannie & Anders - 17. Oktober 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            max-width: 800px;
            width: 100%;
            padding: 60px 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        h1 {
            font-size: 3.5em;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 300;
        }
        
        .ampersand {
            font-size: 0.8em;
            color: #7f8c8d;
            font-style: italic;
        }
        
        .divider {
            width: 100px;
            height: 2px;
            background: #bdc3c7;
            margin: 30px auto;
        }
        
        .info {
            font-size: 1.3em;
            color: #34495e;
            line-height: 1.8;
            margin: 20px 0;
        }
        
        .date {
            font-size: 1.5em;
            color: #2c3e50;
            font-weight: bold;
            margin: 30px 0 10px 0;
        }
        
        .location {
            font-size: 1.2em;
            color: #7f8c8d;
            margin-bottom: 40px;
        }
        
        .message {
            font-size: 1.1em;
            color: #555;
            font-style: italic;
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid #ecf0f1;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2.5em;
            }
            .container {
                padding: 40px 25px;
            }
            .info {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sannie <span class="ampersand">&</span> Anders</h1>
        
        <div class="divider"></div>
        
        <div class="info">
            Vi gifter os!
        </div>
        
        <p class="date">17. Oktober 2026</p>
        
        <p class="location">
            KFUM Lejren, Skåstrup
        </p>
        
        <div class="divider"></div>
        
        <p class="message">
            Mere information følger snart
        </p>
    </div>
</body>
</html>
